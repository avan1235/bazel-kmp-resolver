name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Release version embedded in the native binaries, `dev` when empty
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Restore or save Node.js distribution cache
        uses: actions/cache@v6
        with:
          path: build/node
          key: node-${{ hashFiles('module.yaml') }}
      - name: Restore or save download cache (ktfmt)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/format-cache/downloads
          key: format-${{ hashFiles('module.yaml') }}
      - name: Check formatting
        env:
          BAZEL_KMP_RESOLVER_CACHE_DIR: ${{ runner.temp }}/format-cache
        run: |
          ./kotlin do format
          git diff --exit-code
      - name: Run tests
        run: ./kotlin test

  graalvm-native-image-cache:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Restore or save GraalVM archive cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/graalvm-native-image-cache/downloads
          key: graalvm-native-image-${{ hashFiles('module.yaml') }}
          enableCrossOsArchive: true
      - name: Download GraalVM archives
        env:
          BAZEL_KMP_RESOLVER_CACHE_DIR: ${{ runner.temp }}/graalvm-native-image-cache
        shell: bash
        run: ./kotlin do cacheGraalVmArchives

  native-image:
    needs:
      - test
      - graalvm-native-image-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            executable_extension: ""
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            executable_extension: ""
          - platform: macos-x64
            runner: macos-15-intel
            executable_extension: ""
          - platform: windows-x64
            runner: windows-2025
            executable_extension: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Restore GraalVM archive cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/graalvm-native-image-cache/downloads
          key: graalvm-native-image-${{ hashFiles('module.yaml') }}
          enableCrossOsArchive: true
      - name: Record release version
        if: ${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: printf 'version=%s\n' "$VERSION" > resources/META-INF/bazel-kmp-resolver.properties
      - name: Build native image
        env:
          BAZEL_KMP_RESOLVER_CACHE_DIR: ${{ runner.temp }}/graalvm-native-image-cache
        shell: bash
        run: ./kotlin do buildNativeImage
      - name: Smoke-test native binary
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          binary="build/native-image/bazel-kmp-resolver-${{ matrix.platform }}${{ matrix.executable_extension }}"
          test -f "$binary"
          "$binary" --help >/dev/null
          "$binary" --version | grep -F "${VERSION:-dev}"
          inputs=(
            --coordinate=org.jetbrains.kotlinx:atomicfu:0.26.1
            --repository=https://repo1.maven.org/maven2
            --platform=linux_x64
          )
          "$binary" generate-bazel-manifest "${inputs[@]}" \
            --cache-dir=build/smoke-test/cache \
            --output-manifest-file=build/smoke-test/manifest.json
          grep -F '"platform":"linux_x64"' build/smoke-test/manifest.json
          "$binary" check-bazel-manifest "${inputs[@]}" --manifest-file=build/smoke-test/manifest.json
      - name: Upload native binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: bazel-kmp-resolver-${{ matrix.platform }}
          path: build/native-image/bazel-kmp-resolver-${{ matrix.platform }}${{ matrix.executable_extension }}
          if-no-files-found: error
          retention-days: 7
